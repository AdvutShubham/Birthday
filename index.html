    <script>
    (function(){
        var canvas = $('#canvas');
		
        if (!canvas[0].getContext) {
            $("#error").show();
            return false;        }

        var width = canvas.width();
        var height = canvas.height();        
        canvas.attr("width", width);
        canvas.attr("height", height);
        var opts = {
            seed: {
                x: width / 2 - 20,
                color: "rgb(190, 26, 37)",
                scale: 2
            },
            branch: [
                [535, 680, 570, 250, 500, 200, 30, 100, [
                    [540, 500, 455, 417, 340, 400, 13, 100, [
                        [450, 435, 434, 430, 394, 395, 2, 40]
                    ]],
                    [550, 445, 600, 356, 680, 345, 12, 100, [
                        [578, 400, 648, 409, 661, 426, 3, 80]
                    ]],
                    [539, 281, 537, 248, 534, 217, 3, 40],
                    [546, 397, 413, 247, 328, 244, 9, 80, [
                        [427, 286, 383, 253, 371, 205, 2, 40],
                        [498, 345, 435, 315, 395, 330, 4, 60]
                    ]],
                    [546, 357, 608, 252, 678, 221, 6, 100, [
                        [590, 293, 646, 277, 648, 271, 2, 80]
                    ]]
                ]] 
            ],
            bloom: {
                num: 700,
                width: 1080,
                height: 650,
            },
            footer: {
                width: 1200,
                height: 5,
                speed: 10,
            }
        }

        var tree = new Tree(canvas[0], width, height, opts);
        var seed = tree.seed;
        var foot = tree.footer;
        var hold = 1;

        canvas.click(function(e) {
            playAudio();
            console.log("Helloworld!");
            var offset = canvas.offset(), x, y;
            x = e.pageX - offset.left;
            y = e.pageY - offset.top;
            if (seed.hover(x, y)) {
                hold = 0; 
                canvas.unbind("click");
                canvas.unbind("mousemove");
                canvas.removeClass('hand');
            }
        }).mousemove(function(e){
            var offset = canvas.offset(), x, y;
            x = e.pageX - offset.left;
            y = e.pageY - offset.top;
            canvas.toggleClass('hand', seed.hover(x, y));
        });
        
        

        var seedAnimate = eval(Jscex.compile("async", function () {
            seed.draw();
            while (hold) {
                $await(Jscex.Async.sleep(10));
            }
            while (seed.canScale()) {
                seed.scale(0.95);
                $await(Jscex.Async.sleep(10));
            }
            while (seed.canMove()) {
                seed.move(0, 2);
                foot.draw();
                $await(Jscex.Async.sleep(10));
            }
        }));

        var growAnimate = eval(Jscex.compile("async", function () {
            do {
    	        tree.grow();
                $await(Jscex.Async.sleep(10));
            } while (tree.canGrow());
        }));

        var flowAnimate = eval(Jscex.compile("async", function () {
            do {
    	        tree.flower(2);
                $await(Jscex.Async.sleep(10));
            } while (tree.canFlower());
        }));

        var moveAnimate = eval(Jscex.compile("async", function () {
            tree.snapshot("p1", 240, 0, 610, 680);
            while (tree.move("p1", 500, 0)) {
                foot.draw();
                $await(Jscex.Async.sleep(10));
            }
            foot.draw();
            tree.snapshot("p2", 500, 0, 610, 680);

            canvas.parent().css("background", "url(" + tree.toDataURL('image/png') + ")");
            canvas.css("background", "#ffe");
            $await(Jscex.Async.sleep(300));
            canvas.css("background", "none");
        }));

        var jumpAnimate = eval(Jscex.compile("async", function () {
            var ctx = tree.ctx;
            while (true) {
                tree.ctx.clearRect(0, 0, width, height);
                tree.jump();
                foot.draw();
                $await(Jscex.Async.sleep(25));
            }
        }));

        var textAnimate = eval(Jscex.compile("async", function () {
		    var together = new Date();
		    together.setFullYear(2005, 7, 23); 			
		    together.setHours(0);						
		    together.setMinutes(0);					
		    together.setSeconds(0);					
		    together.setMilliseconds(0);		

		    $("#code").show().typewriter();
            $("#clock-box").fadeIn(500);
            while (true) {
                timeElapse(together);
                $await(Jscex.Async.sleep(1000));
            }
        }));

        var runAsync = eval(Jscex.compile("async", function () {
            $await(seedAnimate());
            $await(growAnimate());
            $await(flowAnimate());
            $await(moveAnimate());

            textAnimate().start();

            $await(jumpAnimate());
        }));

        runAsync().start();
    })();
    </script>

     <style>
/* Gift Button */
#giftBtn{
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.3);
    color: white;
    padding: 14px 22px;
    border-radius: 50px;
    font-size: 18px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 20px rgba(255,105,180,0.5);
    transition: 0.4s;
    z-index: 9999;
    font-family: Arial, sans-serif;
    letter-spacing: 1px;

    animation: wobble 2s infinite;
    transform-origin: center;
}

#giftBtn:hover{
    transform: scale(1.08);
    box-shadow: 0 0 35px rgba(255,105,180,0.9);
    background: rgba(255,255,255,0.2);
}

/* Modal Background */
#giftModal{
    display: none;
    position: fixed;
    z-index: 99999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,20,0.85);
    backdrop-filter: blur(8px);
    animation: fadeIn 0.6s ease;
}

/* Video Container */
.gift-content{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    width: 75%;
    max-width: 850px;
    background: rgba(255,255,255,0.08);
    border-radius: 25px;
    padding: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 0 40px rgba(255,105,180,0.5);
    animation: popup 0.5s forwards;
}

/* Video */
.gift-content video{
    width: 100%;
    border-radius: 20px;
}

/* Close Button */
.closeGift{
    position: absolute;
    top: 12px;
    right: 18px;
    color: white;
    font-size: 32px;
    cursor: pointer;
    transition: 0.3s;
}

.closeGift:hover{
    color: hotpink;
    transform: rotate(90deg);
}

/* Small Floating Hearts */
.heart{
    position: absolute;
    color: pink;
    font-size: 20px;
    animation: floatHearts 6s linear infinite;
    opacity: 0.7;
}

@keyframes popup{
    to{
        transform: translate(-50%, -50%) scale(1);
    }
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

@keyframes floatHearts{
    from{
        transform: translateY(100vh) scale(0.5);
        opacity:0;
    }
    to{
        transform: translateY(-120vh) scale(1.5);
        opacity:1;
    }
}
</style>

<script>
const giftBtn = document.getElementById("giftBtn");
const giftModal = document.getElementById("giftModal");
const closeGift = document.querySelector(".closeGift");
const giftVideo = document.querySelector("#giftModal video");
const bgMusic = document.getElementById("myAudio");

giftBtn.onclick = () => {
    giftModal.style.display = "block";
    //giftVideo.play();
    // Pause background music
    bgMusic.pause();
}

function closeVideoModal() {
    giftModal.style.display = "none";

    // Stop video completely
    giftVideo.pause();
    giftVideo.currentTime = 0;
    // Resume background music
    bgMusic.play();
}

closeGift.onclick = () => {
    closeVideoModal();
}

window.onclick = (e) => {
    if(e.target == giftModal){
        closeVideoModal();
    }
}
